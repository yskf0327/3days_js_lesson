<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習: dialog</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="wrap">
    <h1>練習: dialog</h1>
    <p>「開く」でダイアログを表示し、「閉じる」で閉じましょう（画像のコピーはしません）。</p>
    <button type="button" id="open-btn" class="btn">開く</button>

    <dialog id="sample-dialog" class="sample-dialog">
      <p>ダイアログの中身です。</p>
      <button type="button" id="close-btn" class="btn">閉じる</button>
    </dialog>
  </main>
  <script src="./main.js"></script>
</body>

</html>
